name: nodejs-server-24
services:
  nodejs:
    image: node:24-alpine
    container_name: nodejs-container-24
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./app:/app
      - nodejs_container_24_node_modules:/app/node_modules
    working_dir: /app
    # command: sh -c "npm install && npm start"
    command: tail -f /dev/null

volumes:
  nodejs_container_24_node_modules:
