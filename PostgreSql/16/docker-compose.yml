name: postgresql-16
services:
  postgres:
    image: postgres:16
    container_name: postgresql-container-16
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}       # 从 .env 文件读取
      POSTGRES_PASSWORD: ${POST_PASSWORD} # 从 .env 文件读取
      POSTGRES_DB: ${POSTGRES_DB}           # 默认创建的数据库名
      # 设置时区为上海时间，方便查看日志
      TZ: ${TZ:-Asia/Shanghai}
      # 数据目录优化，通常默认即可，显式声明更清晰
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 数据持久化：将Windows目录映射到容器内
      - ./data:/var/lib/postgresql/data
      # 初始化脚本：容器第一次启动时自动执行该目录下的 .sql 或 .sh 文件
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "${PG_PORT:-5432}:5432"
    # 资源限制（可选，根据你的电脑配置调整）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
