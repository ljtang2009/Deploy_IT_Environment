# 基础配置
listen_addresses = '*'
port = 5432

# 内存相关（示例：总内存 4G 的机器）
shared_buffers = 1GB          # 默认通常 128MB，可提高到系统内存 25% 左右
work_mem = 16MB
maintenance_work_mem = 256MB
effective_cache_size = 3GB

# 连接
max_connections = 100

# 日志（方便排查问题）
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'
log_min_duration_statement = 1000
